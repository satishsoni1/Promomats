name: vodo_mobile
description: "VODO Vault - the web app on your phone: start jobs, review, approve and manage workflow on the go."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
  url_launcher: ^6.3.2
  intl: ^0.20.2
  pdfrx: ^3.0.0
  file_picker: ^10.3.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

# App icon - the VODO mark from the web app (public/images/vodo-logo.svg).
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

# Native launch screen shown while the app starts.
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#FFFFFF"
    image: assets/branding/splash_android12.png
  android: true
  ios: true
  web: false
