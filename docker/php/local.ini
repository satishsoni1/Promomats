; Matches the upload-size guidance in README.md for large promotional
; material (print-ready artwork, video) - raise further if your files
; regularly exceed 500MB.
upload_max_filesize = 500M
post_max_size = 520M
max_execution_time = 300
max_input_time = 300
memory_limit = 512M

; Dev-friendly opcache: revalidates on every request instead of requiring a
; container restart after every code change. Not what you'd want in
; production - tighten this (validate_timestamps=0, precompiled) for a real
; deployment image.
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
